name: Deploy Backend to Deploy Branch

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "package.json"
      - "test/**"
  workflow_dispatch:

jobs:
  # Gate: run the full regression suite (server unit tests + signaling
  # integration that boots its own server) BEFORE deploying. If any test
  # fails, the deployment is blocked.
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Test Dependencies
        working-directory: ./test
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run Regression Suite (server + client unit/integration)
        working-directory: ./test
        run: npm run test:regression

  deploy:
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Ensure package.json is in server directory
        run: |
          cp package.json server/

      - name: Deploy to Deploy Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./server
          keep_files: false
