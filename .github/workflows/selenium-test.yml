name: Selenium Tests (Browser E2E)

on:
  workflow_call:
    inputs:
      test_url:
        description: "URL to test"
        required: false
        type: string
        default: "https://dpxa.github.io/RTCPortal/"
  workflow_dispatch:
    inputs:
      test_url:
        description: "URL to test (defaults to the public GitHub Pages site)"
        required: false
        default: "https://dpxa.github.io/RTCPortal/"
      wait_seconds:
        description: "Extra seconds to wait for deployment before testing"
        required: false
        default: "0"

jobs:
  selenium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_URL: ${{ inputs.test_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2.2.0

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v3

      - name: Install Test Dependencies
        working-directory: ./test
        run: npm install

      - name: Wait for deployment
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.wait_seconds }}" -gt "0" ] 2>/dev/null; then
            sleep ${{ github.event.inputs.wait_seconds }}
          fi

          echo "Sanity-checking deployment at $TEST_URL..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$TEST_URL"; then
              echo "Deployment is reachable."
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not become reachable within 300s." >&2
          exit 1

      - name: Run Selenium UI Test (single peer)
        working-directory: ./test
        run: node selenium/ui-test.js
        timeout-minutes: 5

      - name: Run Selenium Connection Test (two peers + transfer + chat)
        working-directory: ./test
        run: node selenium/connection-test.js
        timeout-minutes: 5
