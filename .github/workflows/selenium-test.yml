name: Selenium Tests (Browser E2E)

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "server/**"
      - "test/**"
  workflow_dispatch:
    inputs:
      test_url:
        description: "URL to test (defaults to the public GitHub Pages site)"
        required: false
        default: "https://dpxa.github.io/RTCPortal/"
      wait_seconds:
        description: "Seconds to wait for deployment before testing"
        required: false
        default: "0"

concurrency:
  group: selenium-test
  cancel-in-progress: true

jobs:
  selenium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "test/package.json"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2.1.1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2.4.0

      - name: Install Test Dependencies
        working-directory: ./test
        run: npm install

      - name: Determine test URL
        id: test-url
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.test_url }}" ]; then
            URL="${{ github.event.inputs.test_url }}"
          else
            URL="https://dpxa.github.io/RTCPortal/"
          fi
          echo "TEST_URL=$URL" >> "$GITHUB_ENV"
          echo "Using TEST_URL: $URL"

      - name: Wait for deployment (optional)
        shell: bash
        run: |
          WAIT="${{ github.event.inputs.wait_seconds }}"
          if [ -n "$WAIT" ] && [ "$WAIT" -gt 0 ]; then
            echo "Waiting ${WAIT}s for deployment..."
            sleep "$WAIT"
          fi

      - name: Run Selenium UI Test (single peer)
        working-directory: ./test
        run: |
          if [ -n "$TEST_URL" ]; then export TEST_URL="$TEST_URL"; fi
          node selenium/ui-test.js
        timeout-minutes: 5

      - name: Run Selenium Connection Test (two peers + transfer + chat)
        working-directory: ./test
        run: |
          if [ -n "$TEST_URL" ]; then export TEST_URL="$TEST_URL"; fi
          node selenium/connection-test.js
        timeout-minutes: 5
