name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "server/**"
      - "test/**"
      - "package.json"
      - "eslint.config.cjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/selenium-test.yml"
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    name: "1. test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Root Dependencies
        run: npm install

      - name: Install Test Dependencies
        working-directory: ./test
        run: npm install

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2.2.0

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v3

      - name: Lint
        run: npm run lint

      - name: Run Full Regression Suite
        working-directory: ./test
        run: npm run test:regression

      - name: Start Dev Server
        run: |
          node server/index.js > /tmp/rtcportal-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/test > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Run Selenium E2E against local dev server
        working-directory: ./test
        run: npm run test:selenium:local

  changes:
    name: "2. changes"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'public/**'
            backend:
              - 'server/**'
              - 'package.json'

  deploy-frontend:
    name: "3. deploy-frontend"
    needs:
      - test
      - changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Write deploy version marker
        run: |
          echo "${{ github.sha }}" > public/version.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: false

      - name: Wait for GitHub Pages to publish
        shell: bash
        run: |
          EXPECTED="${{ github.sha }}"
          echo "Waiting for GitHub Pages to serve version $EXPECTED..."
          for i in $(seq 1 60); do
            DEPLOYED=$( (curl -sf --connect-timeout 5 --max-time 15 -H "Cache-Control: no-cache, no-store" "https://dpxa.github.io/RTCPortal/version.txt?t=$(date +%s)" 2>/dev/null || true) | tr -d '\r\n[:space:]' )
            if [ "$DEPLOYED" = "$EXPECTED" ]; then
              echo "New version is live after $((i * 10))s."
              exit 0
            fi
            echo "Attempt $i: Deployed is '$DEPLOYED', expected '$EXPECTED'. Retrying in 10s..."
            sleep 10
          done
          echo "New version did not become live within 600s." >&2
          exit 1

  deploy-backend:
    name: "4. deploy-backend"
    needs:
      - test
      - changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Write deploy version marker
        run: |
          echo "${{ github.sha }}" > server/version.txt

      - name: Ensure package.json is in server directory
        run: |
          cp package.json server/

      - name: Deploy to Deploy Branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./server
          keep_files: false

      - name: Wait for backend to redeploy
        shell: bash
        run: |
          EXPECTED="${{ github.sha }}"
          echo "Waiting for backend to serve version $EXPECTED..."
          for i in $(seq 1 60); do
            DEPLOYED=$( (curl -sf --connect-timeout 5 --max-time 15 -H "Cache-Control: no-cache, no-store" "https://rtcportal.onrender.com/api/version?t=$(date +%s)" 2>/dev/null || true) | jq -r '.version // empty' | tr -d '\r\n[:space:]' )
            if [ "$DEPLOYED" = "$EXPECTED" ]; then
              echo "Backend is serving the new version after $((i * 10))s."
              exit 0
            fi
            echo "Attempt $i: backend version is '$DEPLOYED', expected '$EXPECTED'. Retrying in 10s..."
            sleep 10
          done
          echo "Backend did not serve the new version within 600s." >&2
          exit 1

  selenium-e2e:
    name: "5. selenium-e2e"
    needs:
      - deploy-frontend
      - deploy-backend
    if: ${{ !cancelled() && !failure() && (needs.deploy-frontend.result == 'success' || needs.deploy-backend.result == 'success') }}
    concurrency:
      group: selenium-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/selenium-test.yml
    with:
      test_url: "https://dpxa.github.io/RTCPortal/"
